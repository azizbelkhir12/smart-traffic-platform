<div class="app-container">

  <app-map
    [departure]="departure"
    [destination]="destination"
    (locationSelected)="onLocationSelected($event)">
  </app-map>

  <div class="floating-panel">
    <app-location-selector
      [departure]="departure"
      [destination]="destination"
      (reset)="resetLocations()">
    </app-location-selector>
  </div>

</div>
